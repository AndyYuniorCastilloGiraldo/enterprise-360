# Configuración de tests de integración
# Sobrescribe las propiedades de producción para el perfil "test".
# Las credenciales se importan desde el archivo .env de Docker Compose, de forma
# que los secretos no se duplican en el código fuente.

spring:
  config:
    import: "optional:file:../../infrastructure/docker/.env[.properties]"

  datasource:
    url: jdbc:postgresql://localhost:5432/enterprise360
    username: enterprise_admin
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

# Clave de prueba: 512 bits en Base64 (sólo para tests; nunca usada en producción).
jwt:
  secret: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==
  expiration-ms: 3600000
