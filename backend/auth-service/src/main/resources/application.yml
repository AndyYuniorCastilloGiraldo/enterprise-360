
spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/enterprise360
    username: enterprise_admin
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
